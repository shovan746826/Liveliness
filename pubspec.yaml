name: face_liveness_kyc
description: Production-ready Face Liveness Verification KYC App — iPhone Face ID style
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Camera & ML ────────────────────────────────────────────────────────
  camera: 0.10.5+5
  google_mlkit_face_detection: 0.10.0
  image: ^4.1.7

  # ─── State Management ───────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  get: any

  # ─── Animations ─────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # ─── Permissions ────────────────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ─── Utilities ──────────────────────────────────────────────────────────
  logger: ^2.3.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  collection: ^1.18.0
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
